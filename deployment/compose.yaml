# M1の通常Compose project。既存のCompose project・データへは触れない。
# DBはホストへポートを公開しない。通常upでmigrationを走らせないためmigrateはtools profileに置く。
name: yori

x-node-service: &node-service
  image: node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
  working_dir: /app
  volumes:
    - ..:/app
    - yori-node-modules:/app/node_modules
    - yori-npm-cache:/root/.npm
  environment:
    DATABASE_URL: postgres://yori:yori@db:5432/yori
    API_HOST: 0.0.0.0
    API_PORT: "3210"
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_USER: yori
      POSTGRES_PASSWORD: yori
      POSTGRES_DB: yori
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - statement_timeout=30000
    volumes:
      - yori-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yori -d yori"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *node-service
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && exec ./node_modules/.bin/tsx src/api/server.ts
    ports:
      - "127.0.0.1:${YORI_API_PORT:-39119}:3210"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3210/health/live').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  # M3 worker。apiのhealthcheck後だけ起動し、共有node_modules volumeへの同時npm ciを避ける。
  # migration適用後に起動する（README参照）。JEV設定が無ければ偽判定せず起動失敗する。
  worker:
    <<: *node-service
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - test -x node_modules/.bin/tsx || npm ci --no-audit --no-fund; exec ./node_modules/.bin/tsx src/worker/cli.ts start
    environment:
      DATABASE_URL: postgres://yori:yori@db:5432/yori
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_ACCOUNT_REF: ${JEV_ACCOUNT_REF:-}
      JEV_API_URL: ${JEV_API_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_CONFIDENCE_THRESHOLD: ${JEV_CONFIDENCE_THRESHOLD:-0.8}
      JEV_INPUT_BUDGET_BYTES: ${JEV_INPUT_BUDGET_BYTES:-8000}
      JEV_REQUEST_TIMEOUT_MS: ${JEV_REQUEST_TIMEOUT_MS:-20000}
      JEV_JOB_LEASE_MS: ${JEV_JOB_LEASE_MS:-60000}
      JEV_WORKER_POLL_MS: ${JEV_WORKER_POLL_MS:-1000}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_ACCOUNT_REF: ${VOYAGE_ACCOUNT_REF:-}
      VOYAGE_API_URL: ${VOYAGE_API_URL:-https://api.voyageai.com/v1/embeddings}
      VOYAGE_REQUEST_TIMEOUT_MS: ${VOYAGE_REQUEST_TIMEOUT_MS:-20000}

  # M8: production profileのHTTPS gateway。通常起動には含めず、apiのhealthcheck後に起動する。
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles:
      - production
    depends_on:
      api:
        condition: service_healthy
    environment:
      YORI_DOMAIN: ${YORI_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - yori-caddy-data:/data
      - yori-caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *node-service
    profiles:
      - tools
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && exec npm run migrate

# volume名は既定で開発用の固定名のまま（通常composeのDB永続化を維持）。
volumes:
  yori-pgdata:
    name: ${YORI_PGDATA_VOLUME:-yori-pgdata}
  yori-caddy-data:
    name: ${YORI_CADDY_DATA_VOLUME:-yori-caddy-data}
  yori-caddy-config:
    name: ${YORI_CADDY_CONFIG_VOLUME:-yori-caddy-config}
  yori-node-modules:
    name: ${YORI_NODE_MODULES_VOLUME:-yori-node-modules}
  yori-npm-cache:
    name: ${YORI_NPM_CACHE_VOLUME:-yori-npm-cache}
